name: V20 Pooled Validation Research

on:
  push:
    branches: [research/v20-pooled-validation-71]
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  pooled-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: "35288111136"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v20-pooled-validation-71

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile research script
        run: python -m py_compile scripts/v20_pooled_validation_research.py

      - name: Download authentic capture A
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-A
          path: captures/A
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download authentic capture B
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-B
          path: captures/B
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download authentic capture C
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-C
          path: captures/C
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download authentic capture D
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-D
          path: captures/D
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify four independent captures
        run: |
          set -euo pipefail
          for s in A B C D; do
            test -f "captures/$s/manifest.json"
            test -f "captures/$s/events.jsonl"
          done

      - name: Run pooled cross-session validation
        run: |
          mkdir -p research_reports
          python scripts/v20_pooled_validation_research.py \
            --captures-root captures \
            --baseline-config app/mm/config_v20_eco_v1_actual_fees.json \
            --candidate-config app/mm/config_backtest_toxicity_v1.json \
            --maker-fee-bps 1.0 \
            --output research_reports/v20_pooled_validation_run_71.json

      - name: Publish pooled research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-pooled-validation-run-71
          path: research_reports/v20_pooled_validation_run_71.json
          if-no-files-found: warn
          retention-days: 30
