name: V20 tests

on:
  push:
    branches:
      - feature/v20-market-making
  pull_request:
    branches:
      - feature/v20-market-making

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile
        run: python -m compileall app tests scripts
      - name: Smoke imports
        run: python -c "import app.mm; import app.mm.execution; import app.mm.execution_replay; import app.mm.event_backtest; import app.mm.live_pnl; import app.mm.live_risk; import app.mm.reconciliation; import app.mm.execution_gateway; import scripts.v20_testnet_smoke; import scripts.v20_event_backtest_capture"
      - name: Tests
        run: python -m pytest -q tests/test_v20_execution_replay.py tests/test_v20_backtest_inventory.py tests/test_v20_event_backtest.py tests/test_v20_event_backtest_toxicity.py tests/test_v20_event_backtest_capture.py tests/test_v20_live_pnl.py tests/test_v20_production_controls.py tests/test_v20_testnet_smoke.py tests/test_v20_user_stream_runtime.py
