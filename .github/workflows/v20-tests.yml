name: V20 tests

on:
  push:
    branches:
      - feature/v20-market-making
  pull_request:
    branches:
      - feature/v20-market-making

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall app tests
      - name: Smoke imports
        run: python -c "import app.mm; import app.mm.execution_replay; import app.mm.event_backtest; import app.mm.live_risk; import app.mm.reconciliation; import app.mm.execution_gateway"
      - name: Tests
        run: python -m pytest -q tests/test_v20_execution_replay.py tests/test_v20_event_backtest.py tests/test_v20_production_controls.py
