name: V10 research tests

on:
  push:
    branches:
      - research/v10-market-making-design
  pull_request:
    branches:
      - research/v10-market-making-design

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy websocket-client
      - name: Run complete V10 research test suite
        run: python -m pytest -q tests/research/test_v10_*.py
