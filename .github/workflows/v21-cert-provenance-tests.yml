name: V21 Certification Provenance Tests

on:
  pull_request:
    paths:
      - "scripts/v21_deployment_gate.py"
      - "scripts/v21_certification_gate.py"
      - "tests/test_v21_deployment_gate.py"
      - ".github/workflows/v21-production-certification.yml"
      - ".github/workflows/v21-orderflow-research.yml"
      - ".gitignore"
  push:
    branches:
      - "fix/v21-cert-provenance-boundary"

permissions:
  contents: read

# Focused fail-closed regression suite for certification provenance.

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile gate code
        run: |
          python -m py_compile scripts/v21_certification_gate.py scripts/v21_deployment_gate.py tests/test_v21_deployment_gate.py
      - name: Run provenance gate tests
        run: |
          python -m pytest -q tests/test_v21_deployment_gate.py
