name: V20 Authenticated Demo Gate

on:
  workflow_dispatch:
    inputs:
      execute_order:
        description: 'Place one explicit post-only demo order, query it, and cancel it'
        required: true
        default: true
        type: boolean

jobs:
  authenticated-demo:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      BINANCE_API_KEY: ${{ secrets.BINANCE_DEMO_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_DEMO_API_SECRET }}
      BINANCE_ORDER_BASE_URL: https://demo-fapi.binance.com
      BINANCE_USER_STREAM_API_URL: wss://testnet.binancefuture.com/ws-fapi/v1
      BINANCE_PRIVATE_STREAM_BASE_URL: wss://fstream.binancefuture.com/private/ws
      V20_TESTNET_EXECUTE: ${{ inputs.execute_order && '1' || '0' }}
      V20_EVIDENCE_PATH: artifacts/v20_testnet_gate.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile production path
        run: python -m compileall app tests scripts
      - name: Run authenticated demo gate
        run: python scripts/v20_authenticated_testnet_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-testnet-gate-evidence
          path: artifacts/v20_testnet_gate.json
          if-no-files-found: warn
