name: V20 Performance Certification

on:
  push:
    branches: [feature/v20-market-making]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  performance-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile and tests
        run: |
          python -m compileall app tests scripts
          python -m pytest -q tests/test_v20_event_backtest.py tests/test_v20_event_backtest_toxicity.py tests/test_v20_execution_replay.py

      - name: Capture authentic Binance BTCUSDT market data
        run: |
          python - <<'PY'
          from app.v10_capture import run_capture
          run_capture(
              symbol='BTCUSDT',
              output_dir='data/cert_capture',
              duration_seconds=1500,
          )
          PY

      - name: Locate capture
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          dirs=(data/cert_capture/*)
          if [ "${#dirs[@]}" -ne 1 ] || [ ! -f "${dirs[0]}/events.jsonl" ]; then
            echo 'No valid single raw capture directory produced.' >&2
            find data/cert_capture -maxdepth 2 -type f -print || true
            exit 1
          fi
          echo "capture_dir=${dirs[0]}" >> "$GITHUB_OUTPUT"

      - name: Performance certification replay
        run: |
          python scripts/v20_performance_certify.py \
            --capture-dir "${{ steps.locate.outputs.capture_dir }}" \
            --baseline-config app/mm/config.json \
            --candidate-config app/mm/config_backtest_toxicity_v1.json \
            --maker-fee-bps 2.0 \
            --output data/v20_performance_certification.json

      - name: Publish certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-performance-certification
          path: data/v20_performance_certification.json
          if-no-files-found: warn
