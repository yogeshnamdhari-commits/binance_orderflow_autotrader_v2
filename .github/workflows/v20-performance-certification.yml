name: V20 Performance Certification

on:
  push:
    branches: [feature/v20-market-making]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  performance-certification:
    strategy:
      fail-fast: false
      matrix:
        session: [A, B, C, D]
    runs-on: ubuntu-latest
    # The authentic capture alone takes 30 minutes; leave deterministic headroom for replay/report generation.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile and tests
        run: |
          python -m compileall app tests scripts
          python -m pytest -q tests/test_v20_event_backtest.py tests/test_v20_event_backtest_toxicity.py tests/test_v20_execution_replay.py tests/test_v20_event_backtest_capture.py

      - name: Capture authentic Binance BTCUSDT market data
        run: |
          python - <<'PY'
          from app.v10_capture import run_capture
          run_capture(
              symbol='BTCUSDT',
              output_dir='data/cert_capture',
              duration_seconds=1800,
          )
          PY

      - name: Locate capture
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          dirs=(data/cert_capture/*)
          if [ "${#dirs[@]}" -ne 1 ] || [ ! -f "${dirs[0]}/events.jsonl" ]; then
            echo 'No valid single raw capture directory produced.' >&2
            find data/cert_capture -maxdepth 2 -type f -print || true
            exit 1
          fi
          echo "capture_dir=${dirs[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate raw capture quality
        run: python scripts/v20_capture_quality_gate.py "${{ steps.locate.outputs.capture_dir }}"

      - name: Performance certification replay
        run: |
          mkdir -p data/cert_reports/${{ matrix.session }}
          python scripts/v20_performance_certify.py \
            --capture-dir "${{ steps.locate.outputs.capture_dir }}" \
            --baseline-config app/mm/config_v20_eco_v1_actual_fees.json \
            --candidate-config app/mm/config_backtest_toxicity_v1.json \
            --maker-fee-bps 1.0 \
            --output data/cert_reports/${{ matrix.session }}/v20_performance_certification.json

      - name: Publish session certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-performance-certification-${{ matrix.session }}
          path: data/cert_reports/${{ matrix.session }}/v20_performance_certification.json
          if-no-files-found: warn

  aggregate:
    needs: performance-certification
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download session reports
        uses: actions/download-artifact@v4
        with:
          pattern: v20-performance-certification-*
          path: cert_reports
          merge-multiple: true

      - name: Aggregate certification
        run: python scripts/v20_certification_aggregate.py cert_reports
