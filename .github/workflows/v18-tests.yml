name: V18 research tests

on:
  push:
    branches:
      - v18-information-set-expansion
  pull_request:
    branches:
      - v18-information-set-expansion

env:
  PYTHONPATH: .

jobs:
  test-v18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/v18 -v
