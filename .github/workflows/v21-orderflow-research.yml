name: V21 Order-Flow Research

on:
  push:
    branches: [research/v21-orderflow-core, research/v21-orderflow-latest]
  workflow_dispatch:
  pull_request:
    branches: [feature/v20-market-making]

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: 35288111136
  RESEARCH_SOURCE_COMMIT: 73abb0a0559af51bd70f0a3d1bbbfc3d702cab00

jobs:
  v21-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile V21 production/research
        run: |
          set -euo pipefail
          python -m py_compile \
            app/research/v21_orderflow_core.py \
            app/research/v21_decision_engine.py \
            app/research/v21_production_model.py \
            app/mm/v21_live_controller.py \
            scripts/v21_orderflow_dataset.py \
            scripts/v21_orderflow_models.py \
            scripts/v21_toxicity_model.py \
            scripts/v21_ablation_research.py \
            scripts/v21_move_regression.py \
            scripts/v21_learned_market_maker.py \
            scripts/v21_economic_spread_sweep.py \
            scripts/v21_economic_risk_sweep.py \
            scripts/v21_certification_gate.py \
            scripts/v21_model_bundle.py \
            scripts/v21_deployment_gate.py \
            tests/test_v21_orderflow_core.py \
            tests/test_v21_orderflow_research.py \
            tests/test_v21_decision_engine.py \
            tests/test_v21_production_model.py \
            tests/test_v21_live_controller.py \
            tests/test_binance_execution.py

      - name: Test V21 production/research
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_v21_orderflow_core.py \
            tests/test_v21_orderflow_research.py \
            tests/test_v21_decision_engine.py \
            tests/test_v21_production_model.py \
            tests/test_v21_live_controller.py             tests/test_binance_execution.py

      - name: Download capture A
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-A
          path: captures/A
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download capture B
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-B
          path: captures/B
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download capture C
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-C
          path: captures/C
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download capture D
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-D
          path: captures/D
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify captures
        run: |
          set -euo pipefail
          for s in A B C D; do
            test -f captures/$s/manifest.json
            test -f captures/$s/snapshot.json
            test -f captures/$s/events.jsonl
          done

      - name: Build current V21 research datasets from authentic captures
        run: |
          set -euo pipefail
          mkdir -p research_reports
          python scripts/v21_orderflow_dataset.py \
            --captures-root captures \
            --output research_reports/v21_orderflow.parquet
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from scripts.v21_toxicity_model import extract_toxicity_session

          frames = [
              extract_toxicity_session(Path("captures") / s, s)
              for s in ("A", "B", "C", "D")
          ]
          df = pd.concat(frames, ignore_index=True)
          df.to_parquet("research_reports/v21_toxicity.parquet", index=False)

          orderflow = pd.read_parquet("research_reports/v21_orderflow.parquet")
          required = {
              "timestamp_ms", "session", "half", "split_start_ms", "mid",
              "future_mid_100ms", "future_mid_250ms", "future_mid_500ms",
              "future_mid_1000ms", "move_100ms", "move_250ms",
              "move_500ms", "move_1000ms", "direction_100ms",
              "direction_250ms", "direction_500ms", "direction_1000ms",
              "depth_5_imbalance",
          }
          missing = sorted(required - set(orderflow.columns))
          if missing:
              raise SystemExit(f"V21_DATASET_SCHEMA_MISSING: {missing}")
          if orderflow.empty or df.empty:
              raise SystemExit("V21_DATASET_EMPTY")
          print({
              "orderflow_rows": len(orderflow),
              "toxicity_rows": len(df),
              "orderflow_sha256": __import__("hashlib").sha256(
                  Path("research_reports/v21_orderflow.parquet").read_bytes()
              ).hexdigest(),
              "toxicity_sha256": __import__("hashlib").sha256(
                  Path("research_reports/v21_toxicity.parquet").read_bytes()
              ).hexdigest(),
          })
          PY

      - name: Record dataset provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import pandas as pd

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          orderflow = pd.read_parquet("research_reports/v21_orderflow.parquet")
          toxicity = pd.read_parquet("research_reports/v21_toxicity.parquet")
          provenance = {
              "schema_version": 1,
              "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
              "github_sha": os.environ.get("GITHUB_SHA", ""),
              "source_commit": os.environ.get("RESEARCH_SOURCE_COMMIT", ""),
              "captures": ["A", "B", "C", "D"],
              "orderflow_sha256": sha("research_reports/v21_orderflow.parquet"),
              "toxicity_sha256": sha("research_reports/v21_toxicity.parquet"),
              "orderflow_rows": int(len(orderflow)),
              "toxicity_rows": int(len(toxicity)),
              "required_future_mid_250ms": "future_mid_250ms" in orderflow.columns,
          }
          Path("research_reports/v21_dataset_provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Replay learned V21 market maker
        run: |
          python scripts/v21_learned_market_maker.py \
            --captures-root captures \
            --dataset research_reports/v21_orderflow.parquet \
            --toxicity research_reports/v21_toxicity.parquet \
            --output research_reports/v21_learned_mm_report.json

      - name: Run nested economic spread sweep
        run: |
          python scripts/v21_economic_spread_sweep.py \
            --captures-root captures \
            --dataset research_reports/v21_orderflow.parquet \
            --toxicity research_reports/v21_toxicity.parquet \
            --output research_reports/v21_economic_spread_sweep.json

      - name: Run nested economic risk sweep
        run: |
          python scripts/v21_economic_risk_sweep.py \
            --captures-root captures \
            --dataset research_reports/v21_orderflow.parquet \
            --toxicity research_reports/v21_toxicity.parquet \
            --output research_reports/v21_economic_risk_sweep.json

      - name: Evaluate toxicity model
        run: |
          python scripts/v21_toxicity_model.py \
            --input research_reports/v21_toxicity.parquet \
            --output research_reports/v21_toxicity_report.json

      - name: Run fail-closed V21 economic certification gate
        run: |
          python scripts/v21_certification_gate.py \
            --learned research_reports/v21_learned_mm_report.json \
            --risk-sweep research_reports/v21_economic_risk_sweep.json \
            --output research_reports/v21_certification_report.json

      - name: Freeze candidate production model bundle
        if: success()
        run: |
          set -euo pipefail
          python scripts/v21_model_bundle.py \
            --dataset research_reports/v21_orderflow.parquet \
            --toxicity research_reports/v21_toxicity.parquet \
            --sessions "$(python -c 'import pandas as pd; print(",".join(sorted(pd.read_parquet("research_reports/v21_orderflow.parquet")["session"].unique().tolist())))')" \
            --output research_reports/v21_production_model_bundle.json

      - name: Publish V21 research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-orderflow-research
          path: research_reports
          if-no-files-found: warn
          retention-days: 30
