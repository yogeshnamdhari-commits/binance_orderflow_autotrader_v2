name: V21 Order-Flow Research

on:
  push:
    branches: [research/v21-orderflow-core]
  workflow_dispatch:
  pull_request:
    branches: [feature/v20-market-making]

env:
  PYTHONPATH: .
  SOURCE_RUN_ID: 35288111136

jobs:
  v21-research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile V21 research
        run: |
          python -m py_compile \
            app/research/v21_orderflow_core.py \
            app/research/v21_decision_engine.py \
            scripts/v21_orderflow_dataset.py \
            scripts/v21_orderflow_models.py \
            scripts/v21_toxicity_model.py \
            scripts/v21_ablation_research.py \
            tests/test_v21_orderflow_research.py \
            tests/test_v21_decision_engine.py

      - name: Test V21 research
        run: |
          python -m pytest -q \
            tests/test_v21_orderflow_core.py \
            tests/test_v21_orderflow_research.py \
            tests/test_v21_decision_engine.py

      - name: Download capture A
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-A
          path: captures/A
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download capture B
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-B
          path: captures/B
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download capture C
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-C
          path: captures/C
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download capture D
        uses: actions/download-artifact@v4
        with:
          name: v20-authentic-capture-D
          path: captures/D
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify captures
        run: |
          set -euo pipefail
          for s in A B C D; do
            test -f captures/$s/manifest.json
            test -f captures/$s/snapshot.json
            test -f captures/$s/events.jsonl
          done

      - name: Build causal dataset
        run: |
          mkdir -p research_reports
          python scripts/v21_orderflow_dataset.py \
            --captures-root captures \
            --output research_reports/v21_orderflow.parquet

      - name: Evaluate two-stage order-flow alpha
        run: |
          python scripts/v21_orderflow_models.py \
            --dataset research_reports/v21_orderflow.parquet \
            --output research_reports/v21_alpha_report.json

      - name: Evaluate order-flow feature ablation
        run: |
          python scripts/v21_ablation_research.py \
            --dataset research_reports/v21_orderflow.parquet \
            --output research_reports/v21_ablation_report.json

      - name: Build toxicity dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from scripts.v21_toxicity_model import extract_toxicity_session
          frames = [
              extract_toxicity_session(Path("captures") / s, s)
              for s in ("A", "B", "C", "D")
          ]
          df = pd.concat(frames, ignore_index=True) if frames else pd.DataFrame()
          Path("research_reports/v21_toxicity.parquet").parent.mkdir(parents=True, exist_ok=True)
          df.to_parquet("research_reports/v21_toxicity.parquet", index=False)
          print({"rows": len(df), "sides": sorted(df.side.unique().tolist()) if len(df) else []})
          PY

      - name: Evaluate toxicity model
        run: |
          python scripts/v21_toxicity_model.py \
            --input research_reports/v21_toxicity.parquet \
            --output research_reports/v21_toxicity_report.json

      - name: Publish V21 research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-orderflow-research
          path: research_reports
          if-no-files-found: warn
          retention-days: 30
