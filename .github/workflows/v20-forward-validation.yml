name: V20 Forward Execution Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v20_testnet_smoke.py'
      - 'tests/test_v20_production_controls.py'
      - 'tests/test_v20_testnet_smoke.py'
      - '.github/workflows/v20-forward-validation.yml'
    branches: [feature/v20-market-making]

jobs:
  forward-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BINANCE_ORDER_BASE_URL: https://demo-fapi.binance.com
      BINANCE_API_KEY: ${{ secrets.BINANCE_DEMO_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_DEMO_API_SECRET }}
      V20_SYMBOL: BTCUSDT
      V20_TESTNET_EXECUTE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Deterministic control tests
        run: |
          python -m pytest -q tests/test_v20_production_controls.py tests/test_v20_testnet_smoke.py tests/test_v20_user_stream_runtime.py
      - name: One-order demo lifecycle
        run: python scripts/v20_testnet_smoke.py
      - name: Residual-position guard
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_DEMO_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_DEMO_API_SECRET }}
        run: |
          python - <<'PY'
          import hashlib, hmac, os, time
          from urllib.parse import urlencode
          import requests
          base = os.environ['BINANCE_ORDER_BASE_URL']
          params = {'symbol': 'BTCUSDT', 'timestamp': int(time.time()*1000), 'recvWindow': 5000}
          q = urlencode(params)
          params['signature'] = hmac.new(os.environ['BINANCE_API_SECRET'].encode(), q.encode(), hashlib.sha256).hexdigest()
          r = requests.get(base + '/fapi/v2/positionRisk', params=params, headers={'X-MBX-APIKEY': os.environ['BINANCE_API_KEY']}, timeout=10)
          r.raise_for_status()
          rows = r.json()
          open_positions = [x for x in rows if x.get('symbol') == 'BTCUSDT' and abs(float(x.get('positionAmt','0'))) > 0]
          if open_positions:
              raise SystemExit(f'RESIDUAL_POSITION_FAILURE: {open_positions}')
          print('RESIDUAL_POSITION_PASS')
          PY
