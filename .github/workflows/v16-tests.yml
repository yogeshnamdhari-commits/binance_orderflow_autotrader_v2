name: V16 tests

on:
  push:
    branches: [v16-autonomous-completion]
  pull_request:
    branches: [v16-autonomous-completion]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest scikit-learn scipy joblib
      - name: Run V16 tests
        run: python -m pytest -q tests/v16
