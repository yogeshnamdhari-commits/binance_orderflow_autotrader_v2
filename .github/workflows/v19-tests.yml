name: V19 tests

on:
  push:
    branches: ["v19-economic-orderflow-research"]
  pull_request:
    branches: ["v18-information-set-expansion"]

jobs:
  v19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/v19 -q
