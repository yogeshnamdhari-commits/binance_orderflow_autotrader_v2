name: V17 production preflight

on:
  push:
    branches: [v17-production-preflight]
  pull_request:
    branches: [v17-production-preflight]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run complete V16/V17 test suite
        run: python -m pytest -q tests/v16 tests/v17
      - name: Run fail-closed production preflight
        run: python -m app.v17.preflight
