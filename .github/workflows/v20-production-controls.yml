name: V20 Production Controls

on:
  push:
    branches: [feature/v20-market-making]
  pull_request:
    branches: [feature/v20-market-making]

jobs:
  v20-controls:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile
        run: python -m compileall app tests
      - name: Import V20
        run: python -c "import app.mm; import app.mm.live_risk; import app.mm.reconciliation; import app.mm.execution_gateway; import app.mm.production_gate"
      - name: V20 production-control tests
        run: python -m pytest -q tests/test_v20_production_controls.py
