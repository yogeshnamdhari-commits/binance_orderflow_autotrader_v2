name: V20 Forward Execution Evidence

on:
  workflow_dispatch:
    inputs:
      hold_seconds:
        description: Seconds to leave the passive test order working
        required: false
        default: '90'

env:
  PYTHONPATH: .

jobs:
  forward-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile and relevant tests
        run: |
          python -m compileall app tests scripts
          python -m pytest -q tests/test_v20_production_controls.py tests/test_v20_testnet_smoke.py tests/test_v20_user_stream_runtime.py

      - name: Run authenticated forward evidence gate
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_DEMO_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_DEMO_API_SECRET }}
          BINANCE_ORDER_BASE_URL: https://demo-fapi.binance.com
          V20_FORWARD_HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          python scripts/v20_forward_execution_gate.py | tee forward_execution_report.txt

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-forward-execution-evidence
          path: forward_execution_report.txt
          if-no-files-found: error
